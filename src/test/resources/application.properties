spring.application.name=devzao
spring.main.banner-mode=off

spring.datasource.url=jdbc:h2:mem:devzao_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false

spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=false

logging.level.root=WARN
logging.level.com.allanvital.devzao=DEBUG

# Prevent background scheduler from firing during tests
devzao.refresh.poll-interval=86400000
