<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="language-section" id="repository-languages" th:fragment="languageChart" th:attr="data-repository-sync-state=${repositorySyncState}">
    <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
        <h2 class="section-title mb-0">Languages</h2>
        <span class="field-label">Repos</span>
    </div>

    <div th:if="${!languageChart.shares.isEmpty()}">
        <div class="language-pie mx-auto mb-3" th:style="'background: ' + ${languageChart.gradient}"></div>
        <div class="language-legend">
            <div class="language-legend-row" th:each="share : ${languageChart.shares}">
                <span class="language-swatch" th:style="'background: ' + ${share.color}"></span>
                <span class="language-name" th:text="${share.language}">Language</span>
                <span class="language-count">
                    <span th:text="${share.repositoryCount}">0</span>
                    <span th:text="${share.repositoryCount == 1 ? 'repo' : 'repos'}">repos</span>
                </span>
            </div>
        </div>
    </div>

    <p class="repository-empty mb-0" th:if="${languageChart.shares.isEmpty() && repositorySyncState != 'FETCHED' && repositorySyncState != 'FAILED'}">
        Language breakdown is being prepared.
    </p>
    <p class="repository-empty mb-0" th:if="${languageChart.shares.isEmpty() && repositorySyncState == 'FETCHED'}">
        No repository language data available.
    </p>
    <p class="repository-empty mb-0" th:if="${languageChart.shares.isEmpty() && repositorySyncState == 'FAILED'}">
        Language breakdown could not be loaded right now.
    </p>
</section>
</body>
</html>
