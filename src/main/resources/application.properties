spring.application.name=devzao
spring.main.banner-mode=off

## logging
logging.level.root=WARN
logging.level.com.allanvital.devzao=INFO
logging.level.org.springframework=WARN
logging.level.org.apache.activemq=WARN
logging.level.org.apache.activemq.audit=WARN
logging.level.org.hibernate=WARN
logging.level.liquibase=WARN
logging.level.com.zaxxer.hikari=WARN

spring.datasource.url=jdbc:h2:file:./data/db;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false

### JMS
spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true
spring.artemis.embedded.persistent=true
spring.artemis.embedded.data-directory=./data/artemis

### GitHub
# If not present, the app will call GitHub anonymously (local/dev convenience)
github.token=${GITHUB_TOKEN:}
# Percentage of rate-limit capacity reserved for live user requests (0-100)
github.rate-limit.live-reserve-percentage=30

### Background refresh
# How often the scheduler polls for stale users (ISO-8601 or millis)
devzao.refresh.poll-interval=3600000
# How old user data must be before re-fetching from GitHub
devzao.refresh.user-interval=24h
# How old repo metadata must be before re-syncing
devzao.refresh.repo-interval=24h
# How old commit analysis must be before re-running
devzao.refresh.analysis-interval=7d
# Maximum users to refresh per poll cycle
devzao.refresh.batch-size=10

### Git
# Maximum number of commits to clone per repository for deep analysis
devzao.git.clone.depth=800
# Temporary path for bare git clones during analysis
devzao.git.clone.temp-path=/tmp/devzao-git

management.endpoints.web.exposure.include=health,info

### Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

### Umami analytics
devzao.umami.script-url=
devzao.umami.website-id=
