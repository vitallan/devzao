databaseChangeLog:
  - changeSet:
      id: 001-init-github-user
      author: allan.vital
      changes:
        - createTable:
            tableName: github_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: github_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: login_lower
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: bio
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true
              - column:
                  name: followers
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: fetched_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: github_user
            columnNames: login_lower
            constraintName: uk_github_user_login_lower
        - addUniqueConstraint:
            tableName: github_user
            columnNames: github_id
            constraintName: uk_github_user_github_id

  - changeSet:
      id: 001-init-github-user-photo
      author: allan.vital
      changes:
        - createTable:
            tableName: github_user_photo
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: github_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: photo_blob
                  type: BLOB
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
        - addUniqueConstraint:
            tableName: github_user_photo
            columnNames: github_user_id
            constraintName: uk_github_user_photo_user
        - addForeignKeyConstraint:
            baseTableName: github_user_photo
            baseColumnNames: github_user_id
            referencedTableName: github_user
            referencedColumnNames: id
            constraintName: fk_github_user_photo_user
            onDelete: CASCADE
